# CI: vet + build both tag variants + race-enabled tests.
#
# The two builds matter because the codebase compiles two previewers:
# the default stub (no "ndi" tag) and the full preview subsystem
# ("-tags ndi"). A change that only builds under one variant has broken
# an installer path before — both installers now use -tags ndi, but
# `go build ./...` remains the doc-advertised control-only build.
#
# -race requires CGo. The app itself is pure Go since storage moved to bytdb,
# but ./... also covers cmd/dbmigrate, whose DuckDB driver is CGo — it ships
# prebuilt static libs, so no extra system dependencies are needed on the runner.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build (stub previewer)
        run: go build ./...

      - name: Build (ndi previewer)
        run: go build -tags ndi ./...

      # Guards the property the installers rely on: the shipped binary must
      # build with no C toolchain. A stray CGo dependency in the app would
      # otherwise only show up as a failed install on a user's machine.
      - name: Build app without CGo
        run: CGO_ENABLED=0 go build -tags ndi -o /dev/null .

      - name: Test (race detector)
        run: go test -race ./...
